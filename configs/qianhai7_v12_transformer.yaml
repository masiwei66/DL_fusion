data:
  data_root: E:/working/DL_data/qianhai_test
  window_length: 6
  stride: 1
  eval_stride: 6
  virtual_point_count_min: 50
  virtual_point_count_max: 100
  noise_std_mm: 0.2
  missing_probability: 0.05
  observation_realizations: 4
  split_stratify: true
  noise_scan_std_mm: [0.0, 0.1, 0.2, 0.4]
  missing_scan_probability: [0.0, 0.05, 0.1, 0.2]
  split_seed: 20260924

train:
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  output_root: result_report/transformer/v1

model:
  # Temporal Transformer 使用与 LSTM/GRU 相同的聚合输入和任务输出。
  name: transformer
  params:
    input_dim: 9
    d_model: 128
    nhead: 4
    num_layers: 2
    dim_feedforward: 256
    dropout: 0.1

regional_targets:
  target_schema: regional_anomaly_v1
  target_version: v1
  label_mode: engineering_anomaly
  material_scale_threshold: 0.90
  bearing_scale_threshold: 0.90
  settlement_ratio_threshold: 0.05
