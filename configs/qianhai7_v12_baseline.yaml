data:
  data_root: E:/working/DL_data/test
  window_length: 6
  stride: 6
  eval_stride: 6
  virtual_point_count_min: 50
  virtual_point_count_max: 100
  noise_std_mm: 0.2
  missing_probability: 0.05
  # Virtual-observation variants mixed within each training epoch. 1 = off.
  observation_realizations: 4
  realization_sampling: balanced_random
  validation_realizations: 4
  # Stratify the state-level split by state_family_id so no mechanism family is
  # missing from training.
  split_stratify: true
  noise_scan_std_mm: [0.0, 0.1, 0.2, 0.4]
  missing_scan_probability: [0.0, 0.05, 0.1, 0.2]
  split_seed: 20260924
train:
  batch_size: 32
  epochs: 2
  learning_rate: 0.001
  lr_scheduler: plateau
  lr_factor: 0.5
  lr_patience: 3
  min_learning_rate: 0.00001
  early_stopping_patience: 10
  # CPU data-loading workers. Start with 4, then compare rate and memory.
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  # Faster host->GPU copies. On a CPU-only torch build this is ignored (warning at most).
  pin_memory: true



model:
  # 默认使用共享节点级输入 [B, W, P, 9]；input_mode: regional 可用于消融。
  name: lstm
  params:
    input_dim: 9
    input_mode: node
    hidden_size: 128
    num_layers: 2
    dropout: 0.1
    bidirectional: false
# model:
#   name: lstm
#   params:
#     hidden_size: 128
#     num_layers: 2
#     dropout: 0.1
regional_targets:
  target_schema: regional_anomaly_v1
  target_version: v1
  label_mode: engineering_anomaly
  material_scale_threshold: 0.90
  bearing_scale_threshold: 0.90
  settlement_ratio_threshold: 0.05
