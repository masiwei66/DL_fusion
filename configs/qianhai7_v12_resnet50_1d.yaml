data:
  data_root: E:/working/DL_data/qianhai7_yearly_temperature_dataset_v3_final
  window_length: 6
  stride: 1
  eval_stride: 6
  virtual_point_count_min: 50
  virtual_point_count_max: 100
  noise_std_mm: 0.2
  missing_probability: 0.05
  observation_realizations: 4
  realization_sampling: balanced_random
  validation_realizations: 4
  split_stratify: true
  noise_scan_std_mm: [0.0, 0.1, 0.2, 0.4]
  missing_scan_probability: [0.0, 0.05, 0.1, 0.2]
  split_seed: 20260924

train:
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: plateau
  lr_factor: 0.5
  lr_patience: 3
  min_learning_rate: 0.00001
  early_stopping_patience: 10
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  output_root: result_report/resnet50_1d/v1

model:
  # 仅需将 name 改为 lstm，即可在相同输入、输出和数据划分下运行 LSTM。
  # LSTM 参数可按需调整；默认配置与当前 ResNet 实验保持可比的输入维度。
  name: resnet50_1d
  params:
    input_dim: 9
    base_width: 32
    layers: [3, 4, 6, 3]
    # Keep all temporal resolutions for the six-step window.
    stage_strides: [1, 1, 1, 1]

regional_targets:
  target_schema: regional_anomaly_v1
  target_version: v1
  label_mode: engineering_anomaly
  material_scale_threshold: 0.90
  bearing_scale_threshold: 0.90
  settlement_ratio_threshold: 0.05
